name: grep
description: >
  Search file contents by regex pattern. Returns matching lines with
  file paths and line numbers. Use to find symbols, patterns, or citations
  across the codebase or knowledge layer.
parameters:
  type: object
  properties:
    pattern:
      type: string
      description: Regex pattern to search for
    path:
      type: string
      description: Directory to search in (relative to sandbox root, default '.')
      default: "."
    glob_filter:
      type: string
      description: Glob pattern to filter files (e.g. '*.md', '*.py')
  required: [pattern]
