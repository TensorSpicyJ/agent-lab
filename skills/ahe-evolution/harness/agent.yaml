# Research Agent Harness Configuration
#
# This is the YAML definition of the evolvable research agent.
# Each component can be independently enabled/disabled for evolution.

type: agent
name: research_agent
max_turns: 15

# ---- System Prompt ----
system_prompt: "./systemprompt.md"
system_prompt_type: jinja        # Supports {{ date }}, {{ working_directory }}, etc.

# ---- LLM Configuration ----
llm_config:
  model: "${LLM_MODEL}"
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  max_tokens: 32000
  temperature: 0.7

# ---- Tools ----
tools:
  - name: read_file
    description_path: "./tool_descriptions/read_file.tool.yaml"
    binding: tools.file_tools:read_file

  - name: write_file
    description_path: "./tool_descriptions/write_file.tool.yaml"
    binding: tools.file_tools:write_file

  - name: run_shell
    description_path: "./tool_descriptions/run_shell.tool.yaml"
    binding: tools.shell_tools:run_shell

  - name: grep
    description_path: "./tool_descriptions/grep.tool.yaml"
    binding: tools.search_tools:grep

  - name: glob
    description_path: "./tool_descriptions/glob.tool.yaml"
    binding: tools.search_tools:glob_search

  - name: web_search
    description_path: "./tool_descriptions/web_search.tool.yaml"
    binding: tools.web_tools:web_search

  - name: complete_task
    description_path: "./tool_descriptions/complete_task.tool.yaml"
    binding: tools.session_tools:complete_task

stop_tools:
  - complete_task

# ---- Middleware Pipeline ----
# Ordered: each hook runs middleware in list order (top-to-bottom for before_*,
# bottom-to-top for after_*).
middlewares:
  - import: middleware.physics_thinking:PhysicsThinkingMiddleware
    params:
      enabled: true
      skip_on_turn: 0

  - import: middleware.dimensional_check:DimensionalCheckMiddleware
    params:
      enabled: true

  - import: middleware.limit_check:LimitCheckMiddleware
    params:
      enabled: true

# ---- Skills ----
skills:
  - "./skills/paper-to-insight"
  - "./skills/state-overview"
  - "./skills/derivation-tracker"

# ---- Evolution Control ----
# These flags control which components the evolve agent may modify.
# Override in experiment config to unlock specific components.
evolution:
  locked:
    systemprompt_md: true
    agent_yaml: true
    tool_descriptions: true
    tools: true
    middleware: true
    skills: true
    long_term_memory: true
