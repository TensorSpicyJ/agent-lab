benchmark_id: web-physics-result-only-v0.1
created: 2026-06-02
purpose: "Initial result-only baseline for Kimi Code + Kimi-k2.6 on public OpenStax physics examples."
status: draft

agent:
  default_cli: kimi
  default_model_alias: kimi-code/kimi-for-coding
  local_display_name: Kimi-k2.6
  kimi_version_recorded_per_run: true

validity_policy:
  local_leakage_boundary: "Run script copies only prompt.md into a temp cwd."
  network_allowed: false
  network_enforced: false
  scoring_scope: "Final numerical answers only; no derivation scoring."

tasks:
  - id: openstax-result-only-suite
    revision: 0
    status: ready
    prompt: tasks/openstax-result-only-suite/prompt.md
    gold: tasks/openstax-result-only-suite/private/gold.json
    verifier: tasks/openstax-result-only-suite/verify.py
    expected_checks: 17
