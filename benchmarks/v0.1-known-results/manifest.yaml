      - source_grounding
      - uncertainty_control

  - id: numeric-known-limit-check
    revision: 0
    lane: numeric
    status: planned
    prompt: tasks/numeric-known-limit-check/prompt.md
    gold: tasks/numeric-known-limit-check/gold.md
    expected_checks:
      - final_result
      - physics_checks
      - uncertainty_control

baseline_exit_criteria:
  minimum_tasks_to_freeze: 3
  preferred_tasks_to_freeze: 5
  minimum_rollouts_per_agent: 2
  required_agents:
    - kimi_vanilla
    - kimi_project_default
